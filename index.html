<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/brand/tiajuca.svg" />
    <link rel="icon" type="image/png" href="/brand/tiajuca.png" />
    <link rel="apple-touch-icon" href="/brand/tiajuca.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e93d2b" />
    <title>Cordão da Tia Juca</title>
    <!-- Pré-visualização do link (WhatsApp, Instagram, etc.): nome e logo do bloco. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cordão da Tia Juca" />
    <meta property="og:title" content="Cordão da Tia Juca" />
    <meta property="og:description" content="Bloco de carnaval" />
    <meta name="description" content="Bloco de carnaval" />
    <meta property="og:image" content="https://tiajuca.cordaodatiajuca.workers.dev/brand/tiajuca-share.png" />
    <meta property="og:image:width" content="200" />
    <meta property="og:image:height" content="200" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Cordão da Tia Juca" />
    <meta name="twitter:description" content="Bloco de carnaval" />
    <meta name="twitter:image" content="https://tiajuca.cordaodatiajuca.workers.dev/brand/tiajuca-share.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Se o app não aparecer (arquivo ainda sendo publicado, rede falhou), tenta de novo uma vez em vez de deixar a tela em branco.
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r && !r.firstChild) { try { if (sessionStorage.getItem('sigbloco:empty-reload')) return; sessionStorage.setItem('sigbloco:empty-reload', '1') } catch (e) {} location.reload() }
      }, 4000)
    </script>
  </body>
</html>
